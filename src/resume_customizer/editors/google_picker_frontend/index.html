<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }
      button {
        padding: 0.35rem 0.85rem;
        cursor: pointer;
      }
    </style>
    <script src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <button id="pick" type="button">Pick a Google Doc</button>
    <script>
      const BUTTON_HEIGHT = 52;
      const PICKER_HEIGHT = 620;

      function post(type, extra) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
      }
      const Streamlit = {
        setComponentReady: function () {
          post("streamlit:componentReady", { apiVersion: 1 });
        },
        setFrameHeight: function (height) {
          post("streamlit:setFrameHeight", { height: height });
        },
        setComponentValue: function (value) {
          post("streamlit:setComponentValue", { value: value });
        },
      };

      let args = {};
      let pickerInstance = null;
      window.addEventListener("message", function (event) {
        if (event.data && event.data.type === "streamlit:render") {
          args = event.data.args || {};
        }
      });

      function showButton() {
        document.getElementById("pick").hidden = false;
        Streamlit.setFrameHeight(BUTTON_HEIGHT);
      }

      function closePickerUi() {
        if (pickerInstance) {
          try {
            pickerInstance.setVisible(false);
          } catch (e) {
            /* picker already torn down */
          }
          pickerInstance = null;
        }
        showButton();
      }

      function openPicker() {
        const token = args.token;
        const apiKey = args.apiKey;
        const appId = args.appId;
        const origin = args.origin;
        if (!token || !apiKey || !appId) {
          return;
        }
        gapi.load("picker", function () {
          document.getElementById("pick").hidden = true;
          Streamlit.setFrameHeight(PICKER_HEIGHT);
          const width = Math.max(window.innerWidth - 8, 320);
          // Keep in sync with resume_customizer.google_docs_ops.GOOGLE_DOC_MIME
          const view = new google.picker.DocsView()
            .setMimeTypes("application/vnd.google-apps.document")
            .setMode(google.picker.DocsViewMode.LIST);
          let builder = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(token)
            .setDeveloperKey(apiKey)
            .setAppId(String(appId))
            .setSize(width, PICKER_HEIGHT - 12)
            .setCallback(function (data) {
              const action = data[google.picker.Response.ACTION];
              if (action === google.picker.Action.PICKED) {
                const doc = data[google.picker.Response.DOCUMENTS][0];
                Streamlit.setComponentValue({
                  id: doc[google.picker.Document.ID],
                  name: doc[google.picker.Document.NAME],
                  mimeType: doc[google.picker.Document.MIME_TYPE],
                });
                closePickerUi();
              } else if (action === google.picker.Action.CANCEL) {
                closePickerUi();
              }
            });
          if (origin) {
            builder = builder.setOrigin(origin);
          }
          pickerInstance = builder.build();
          pickerInstance.setVisible(true);
        });
      }

      document.getElementById("pick").addEventListener("click", openPicker);
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(BUTTON_HEIGHT);
    </script>
  </body>
</html>
